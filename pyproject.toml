[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-computer"
version = "0.1.0"
description = "Windows desktop control, capture, and GUI understanding toolkit for AI agents."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "google-genai>=1.8.0",
  "mss>=10.0.0",
  "Pillow>=10.4.0",
  "pydantic>=2.9.0",
  "python-dotenv>=1.0.1",
  "pyautogui>=0.9.54",
  "pywin32>=308",
]

[project.scripts]
agent-computer = "agent_computer.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["agent_computer*"]
namespaces = false
